name: DropFill build & test

on:
  push:
    branches: [dropfill]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Script tests (jsdom)
        run: |
          npm i --no-save jsdom@24 >/dev/null
          node js/test.js .
          node js/gatetest.js .

  ios:
    runs-on: macos-latest
    needs: js-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check generated scripts are up to date
        run: |
          ./gen_scripts.sh
          git diff --exit-code DropFill/Scripts.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check site addresses connect (Supreme KR / Palace KR)
        run: |
          mkdir -p out
          for u in https://kr.supreme.com https://kr.palaceskateboards.com; do
            set +e
            code=$(curl -s -o /dev/null -L --max-time 20 -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1" -w "%{http_code} %{url_effective}" "$u")
            rc=$?
            set -e
            echo "$u -> rc=$rc $code" | tee -a out/sites.txt
            if [ $rc -eq 6 ]; then echo "::error::$u 주소를 찾을 수 없음 (DNS)"; exit 1; fi
          done

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(rt,x) for rt,l in d.items() if 'iOS' in rt for x in l if x['name'].startswith('iPhone')]
          c.sort(key=lambda p:p[0])
          print(c[-1][1]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          mkdir -p out
          xcrun simctl list devices | grep "$UDID" | tee out/simulator.txt

      - name: Unit + UI tests on simulator (real WebKit)
        run: |
          set -o pipefail
          mkdir -p out/shots
          TEST_RUNNER_SHOT_DIR="$PWD/out/shots" \
          xcodebuild test -project DropFill.xcodeproj -scheme DropFill \
            -destination "id=$UDID" -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/test.log | grep -E "error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)|XCTAssert" || true
          grep -q "TEST SUCCEEDED" out/test.log

      - name: Overwrite install keeps saved data (SideStore 업데이트 방식)
        run: |
          APP=$(find simbuild/Build/Products -name DropFill.app -path "*iphonesimulator*" | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl terminate "$UDID" com.hyuk.dropfill || true
          sleep 3
          PL="$(xcrun simctl get_app_container "$UDID" com.hyuk.dropfill data)/Library/Preferences/com.hyuk.dropfill.plist"
          test -f "$PL" || { echo "::error::설치 전 저장된 설정이 없음"; exit 1; }
          B1=$(plutil -extract profile raw -o - "$PL")
          echo "before: $(echo "$B1" | base64 -d | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("address2"), "|", d.get("address2En"))')"
          # 지우지 않고 같은 앱을 다시 설치(덮어쓰기) → 실행 → 종료
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.hyuk.dropfill -uitest
          sleep 12
          xcrun simctl terminate "$UDID" com.hyuk.dropfill || true
          sleep 3
          PL2="$(xcrun simctl get_app_container "$UDID" com.hyuk.dropfill data)/Library/Preferences/com.hyuk.dropfill.plist"
          B2=$(plutil -extract profile raw -o - "$PL2")
          echo "after:  $(echo "$B2" | base64 -d | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("address2"), "|", d.get("address2En"))')"
          [ "$B1" = "$B2" ] || { echo "::error::덮어쓰기 설치 후 배송지가 바뀜"; exit 1; }
          echo "$B2" | base64 -d | grep -q "1001" || { echo "::error::상세주소가 없음"; exit 1; }
          echo "OK: 덮어쓰기 설치 후에도 배송지 그대로" | tee out/upgrade.txt

      - name: Launch app and screenshot
        if: always()
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find simbuild/Build/Products -name DropFill.app -path "*iphonesimulator*" | head -1)
          xcrun simctl uninstall "$UDID" com.hyuk.dropfill || true   # 테스트가 남긴 데이터 지우고 새로 설치
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.hyuk.dropfill
          sleep 25
          xcrun simctl io "$UDID" screenshot out/launch.png || true
          xcrun simctl terminate "$UDID" com.hyuk.dropfill || true
          xcrun simctl launch "$UDID" com.hyuk.dropfill -startTab palace
          sleep 25
          xcrun simctl io "$UDID" screenshot out/launch-palace.png || true
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "DropFill"' --style compact 2>/dev/null \
            | grep -iE "error|fault|crash" | head -n 40 > out/app-log.txt || true

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild -project DropFill.xcodeproj -scheme DropFill \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee out/build.log | tail -n 5

      - name: Show errors only
        if: failure()
        run: grep -hE "error:|fatal error|FAILED|failed" out/*.log | head -n 80 || true

      - name: Check app name is ASCII (SideStore/AltStore App ID requirement)
        run: |
          PL=build/Build/Products/Release-iphoneos/DropFill.app/Info.plist
          for k in CFBundleDisplayName CFBundleName; do
            v=$(/usr/libexec/PlistBuddy -c "Print :$k" "$PL")
            echo "$k = $v"
            echo "$v" | LC_ALL=C grep -q '^[A-Za-z0-9 ]*$' || { echo "::error::$k must be ASCII"; exit 1; }
          done
          echo "ko.lproj:"; cat build/Build/Products/Release-iphoneos/DropFill.app/ko.lproj/InfoPlist.strings | iconv -f UTF-16 -t UTF-8 2>/dev/null || plutil -p build/Build/Products/Release-iphoneos/DropFill.app/ko.lproj/InfoPlist.strings

      - name: Package IPA (파일명에 버전)
        run: |
          PL=build/Build/Products/Release-iphoneos/DropFill.app/Info.plist
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PL")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PL")
          IPA="DropFill-v${VER}.ipa"
          echo "VER=$VER" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "IPA=$IPA" >> $GITHUB_ENV
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DropFill.app Payload/
          zip -qry "$IPA" Payload
          ls -la "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: DropFill-v${{ env.VER }}
          path: ${{ env.IPA }}

      - name: Publish to Releases (dropfill-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dropfill-latest --yes --cleanup-tag || true
          gh release create dropfill-latest "$IPA" \
            --target "$GITHUB_SHA" \
            --title "드랍필 v${VER} (빌드 ${BUILD}, $(date -u -v+9H '+%Y-%m-%d %H:%M') KST)" \
            --notes "드랍필 v${VER} (빌드 ${BUILD}) — dropfill 브랜치 커밋 ${GITHUB_SHA::7} 에서 빌드한 서명 없는 IPA입니다. SideStore/Sideloadly로 설치하세요." \
            --prerelease --latest=false

      - name: Save results to dropfill-test-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b dropfill-test-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "DropFill test results for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dropfill-test-results
