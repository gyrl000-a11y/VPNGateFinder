name: VPNGateFinder
options:
  bundleIdPrefix: com.hyuk
  deploymentTarget:
    iOS: "16.0"
targets:
  VPNGateFinder:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyuk.vpngatefinder
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: VPN 찾기
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSExceptionDomains:
            vpngate.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
schemes:
  VPNGateFinder:
    build:
      targets:
        VPNGateFinder: all
